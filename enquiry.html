<!DOCTYPE html>
<html lang="en"> <!-- Sets the language of the page to English -->
<head>
  <meta charset="UTF-8"> <!-- Defines character encoding -->
  <title>Enquiry - Urban Barista</title>
  <link rel="stylesheet" href="css/style.css"> <!-- Links to external CSS file -->
</head>

<!-- This connects this html to javascript -->
<script src="javascript/main.js"></script>

<body>

  <!-- HEADER -->
  <!-- The opening of every page --> 
  <header>
  <nav>
    <div class="logo">
        <img src="images/CoffeeMug.JPG.jpg"  width="60" height="60">
        Urban<span>Barista</span>
    </div>
    <ul>
      <!-- Each link goes to a different page of the site -->
      <a href="index.html">| Home | </a> 
      <a href="about.html"> About Us | </a> 
      <a href="services.html"> Products/Services | </a> 
      <a href="enquiry.html"> Enquiry | </a> 
      <a href="contact.html"> Contact | </a>   
    </ul>
  </nav>
</header>

  <!-- Enquiry Form Section -->
  <section class="enquiry">
     <!-- Heading for the form -->
    <h1 align="center">Enquiry</h1>

    <form action="submit_enquiry.php" method="post">

       <!-- Name field -->
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name" required><br><br>

      <!-- Email field -->
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <!-- Dropdown menu for enquiry type -->
      <label for="enquiry-type">Enquiry Type:</label><br>
      <select id="enquiry-type" name="enquiry-type" required>
        <option value="product">Product Enquiry</option>
        <option value="service">Service Enquiry</option>
        <!-- Extra options for NPO version -->
        <option value="volunteer">Volunteer Enquiry</option>
        <option value="sponsor">Sponsor Enquiry</option>
      </select><br><br>

       <!-- Message text area -->
      <label for="message">Message:</label><br>
      <textarea id="message" name="message" rows="5" required></textarea><br><br>

       <!-- Submit button -->
      <button type="submit">Submit Enquiry</button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer>
